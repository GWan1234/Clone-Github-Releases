name: Clone Backup Repositories C

on:
  workflow_run:
    workflows: [Clone Backup Repositories A]
    types:
      - completed

  workflow_dispatch:


permissions:
  contents: write

concurrency:
  group: clone-backup-repositories-c
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_TOKEN }}

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::MY_TOKEN secret is empty"
            exit 1
          fi
          gh auth status
          python3 --version
          df -h

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Backup repositories by batch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import sys
          import json
          import yaml
          import hashlib
          import subprocess
          import tempfile
          import shutil
          import re
          import time
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote

          # Make sure nothing git-related ever blocks on a prompt.
          os.environ.setdefault("GIT_TERMINAL_PROMPT", "0")
          os.environ.setdefault("GIT_ASKPASS", "echo")

          TOKEN = os.environ.get("GH_TOKEN", "").strip()
          TARGET = os.environ["GH_REPO"]
          TARGET_BRANCH = os.environ["GH_BRANCH"]

          if not TOKEN:
              print("ERROR: GH_TOKEN is empty", file=sys.stderr)
              sys.exit(1)

          CONFIG = Path("repositoriesc.yaml")
          TRACKING = Path("commit-trackingc.yaml")

          # Keep uploaded assets below GitHub's per-file limit.
          MAX_ASSET_SIZE = 1900 * 1024 * 1024

          class ApiError(RuntimeError):
              pass

          class PermanentSkip(RuntimeError):
              """Repository is permanently unavailable
              (e.g. disabled by GitHub staff)."""
              pass

          # Phrases that indicate a permanent, non-retryable condition.
          PERMANENT_MARKERS = (
              "disabled by GitHub staff",
              "has been disabled by GitHub staff",
              "access to this repository has been disabled",
              "returned error: 403",
              "repository access blocked",
              "This repository has been disabled",
          )

          def is_permanent_error(text):
              if not text:
                  return False
              low = text.lower()
              for marker in PERMANENT_MARKERS:
                  if marker.lower() in low:
                      return True
              return False

          def run(args, check=True, cwd=None):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  cwd=cwd,
              )
              if check and p.returncode:
                  raise RuntimeError(
                      f"Command failed: {' '.join(map(str, args))}\n"
                      f"{(p.stderr or '').strip()}"
                  )
              return p

          def api(endpoint, allow_404=False):
              p = run(["gh", "api", endpoint], check=False)

              if p.returncode == 0:
                  out = (p.stdout or "").strip()
                  if not out:
                      return None
                  try:
                      return json.loads(out)
                  except (ValueError, TypeError) as exc:
                      raise ApiError(
                          f"gh api {endpoint}: invalid JSON: {exc}"
                      )

              stderr = (p.stderr or "").strip()
              stdout = (p.stdout or "").strip()
              combined = f"{stderr}\n{stdout}"

              # 403 disabled / banned repositories -> permanent skip.
              if is_permanent_error(combined):
                  raise PermanentSkip(
                      f"gh api {endpoint}: repository disabled "
                      f"({stderr or stdout or 'no output'})"
                  )

              if allow_404 and (
                  "HTTP 404" in stderr or "Not Found" in stderr
              ):
                  return None

              raise ApiError(
                  f"gh api {endpoint} failed "
                  f"(exit {p.returncode}): "
                  f"{stderr or stdout or '<no output>'}"
              )

          def api_with_retry(endpoint, retries=4, allow_404=False):
              last = None
              for attempt in range(1, retries + 1):
                  try:
                      return api(endpoint, allow_404=allow_404)
                  except PermanentSkip:
                      # No point retrying a permanently disabled repo.
                      raise
                  except ApiError as exc:
                      msg = str(exc)
                      last = exc
                      transient = (
                          "HTTP 429" in msg
                          or "rate limit" in msg.lower()
                          or "HTTP 500" in msg
                          or "HTTP 502" in msg
                          or "HTTP 503" in msg
                          or "HTTP 504" in msg
                          or "timeout" in msg.lower()
                          or "connection" in msg.lower()
                          or "TLS" in msg
                      )
                      if transient and attempt < retries:
                          wait = 5 * attempt
                          print(
                              f"  Transient API error "
                              f"(attempt {attempt}/{retries}), "
                              f"retrying in {wait}s: {msg}",
                              file=sys.stderr,
                          )
                          time.sleep(wait)
                          continue
                      raise
              raise last

          def valid_repo(value):
              if not isinstance(value, str):
                  return None

              value = value.strip().rstrip("/")
              value = re.sub(
                  r"^https?://github\.com/", "", value
              )
              value = re.sub(r"\.git$", "", value)

              if re.fullmatch(
                  r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", value
              ):
                  return value

              return None

          def safe_name(value):
              value = re.sub(
                  r"[^A-Za-z0-9_.-]", "_", str(value)
              )
              return value[:140] or "unnamed"

          def disk_status(label):
              print(f"\n=== Disk usage: {label} ===")
              for cmd in (["df", "-h", "/tmp"], ["df", "-i", "/tmp"]):
                  p = run(cmd, check=False)
                  out = (p.stdout or "").rstrip()
                  if out:
                      print(out)

          def check_rate_limit():
              try:
                  data = api("rate_limit")
              except PermanentSkip:
                  raise
              except ApiError as exc:
                  print(
                      f"WARNING: cannot check rate limit: {exc}",
                      file=sys.stderr,
                  )
                  return

              core = (data or {}).get("resources", {}).get(
                  "core", {}
              )
              remaining = core.get("remaining")
              limit = core.get("limit")
              reset = core.get("reset")

              reset_str = ""
              if isinstance(reset, (int, float)):
                  reset_str = datetime.fromtimestamp(
                      reset, tz=timezone.utc
                  ).strftime("%Y-%m-%d %H:%M:%S UTC")

              print(
                  f"GitHub core rate limit: "
                  f"{remaining}/{limit} "
                  f"(reset at {reset_str})"
              )

              if isinstance(remaining, int) and remaining < 100:
                  raise RuntimeError(
                      f"Rate limit almost exhausted: "
                      f"{remaining}/{limit} remaining "
                      f"(reset at {reset_str}). "
                      "Try again after reset."
                  )

          def owner_repositories(owner):
              last_error = None

              # Support both organizations and user accounts.
              for prefix in ("orgs", "users"):
                  result = []
                  page = 1
                  valid = True

                  while True:
                      endpoint = (
                          f"{prefix}/{quote(owner, safe='')}"
                          f"/repos?type=all"
                          f"&per_page=100&page={page}"
                      )

                      try:
                          data = api_with_retry(endpoint)
                      except PermanentSkip:
                          # Whole owner disabled: let caller skip.
                          raise
                      except ApiError as exc:
                          last_error = exc
                          valid = False
                          break

                      if not isinstance(data, list):
                          last_error = ApiError(
                              f"Unexpected response listing "
                              f"{prefix}/{owner}"
                          )
                          valid = False
                          break

                      for item in data:
                          if isinstance(item, dict):
                              repo = valid_repo(
                                  item.get("full_name")
                              )
                              if repo:
                                  result.append(repo)

                      if len(data) < 100:
                          break

                      page += 1

                  if valid:
                      return result

              raise RuntimeError(
                  f"Unable to list repositories for owner "
                  f"{owner}: {last_error}"
              )

          def fetch_branch_dates_graphql(repo):
              """
              One GraphQL call, sorted by TAG_COMMIT_DATE desc.
              Returns {branch_name: iso_date} for top branches.
              """
              owner, name = repo.split("/", 1)

              query = (
                  "query($owner: String!, $name: String!) {"
                  "  repository(owner: $owner, name: $name) {"
                  '    refs(refPrefix: "refs/heads/", first: 100, '
                  "         orderBy: {field: TAG_COMMIT_DATE, "
                  "                  direction: DESC}) {"
                  "      nodes {"
                  "        name"
                  "        target { ... on Commit "
                  "                 { committedDate } }"
                  "      }"
                  "    }"
                  "  }"
                  "}"
              )

              p = run(
                  [
                      "gh", "api", "graphql",
                      "-f", f"query={query}",
                      "-F", f"owner={owner}",
                      "-F", f"name={name}",
                  ],
                  check=False,
              )

              if p.returncode:
                  err = (
                      (p.stderr or "").strip()
                      or (p.stdout or "").strip()
                  )
                  if is_permanent_error(err):
                      raise PermanentSkip(
                          f"graphql branches {repo} disabled: {err}"
                      )
                  raise ApiError(
                      f"graphql branches {repo} failed: {err}"
                  )

              data = json.loads(p.stdout)

              errors = data.get("errors") or []
              if errors:
                  joined = "; ".join(
                      str(e.get("message", e))
                      if isinstance(e, dict) else str(e)
                      for e in errors
                  )
                  if is_permanent_error(joined):
                      raise PermanentSkip(
                          f"graphql branches {repo} disabled: "
                          f"{joined}"
                      )

              nodes = (
                  data.get("data", {})
                      .get("repository", {})
                      .get("refs", {})
                      .get("nodes", [])
                  or []
              )

              out = {}
              for n in nodes:
                  bn = n.get("name")
                  if not bn:
                      continue
                  d = (n.get("target") or {}).get(
                      "committedDate"
                  ) or ""
                  out[bn] = d
              return out

          def get_branches(repo, limit=10):
              """
              List branches via git ls-remote (0 REST calls),
              then enrich with dates via 1 GraphQL call.

              Raises PermanentSkip when GitHub disabled the repo.
              """
              url = (
                  f"https://x-access-token:{TOKEN}"
                  f"@github.com/{repo}.git"
              )

              p = run(
                  ["git", "ls-remote", "--heads", url],
                  check=False,
              )

              if p.returncode:
                  err = (
                      (p.stderr or "").strip()
                      or (p.stdout or "").strip()
                      or "<no output>"
                  ).replace(TOKEN, "***")

                  # GitHub staff disabled / banned repository:
                  # permanent, non-retryable.
                  if is_permanent_error(err):
                      raise PermanentSkip(
                          f"repository disabled by GitHub: {repo}"
                      )

                  raise RuntimeError(
                      f"git ls-remote failed for {repo}: {err}"
                  )

              refs = []
              for line in p.stdout.splitlines():
                  if "\t" not in line:
                      continue
                  sha, ref = line.split("\t", 1)
                  ref = ref.strip()
                  if not ref.startswith("refs/heads/"):
                      continue
                  refs.append({
                      "name": ref[len("refs/heads/"):],
                      "sha": sha.strip(),
                      "date": "",
                  })

              if not refs:
                  return []

              try:
                  dates = fetch_branch_dates_graphql(repo)
                  for r in refs:
                      r["date"] = dates.get(r["name"], "")
              except PermanentSkip:
                  raise
              except Exception as exc:
                  print(
                      f"  (branch date query skipped "
                      f"for {repo}: {exc})",
                      file=sys.stderr,
                  )

              refs.sort(
                  key=lambda b: (
                      b["date"] or "",
                      b["name"],
                  ),
                  reverse=True,
              )
              return refs[:limit]

          def latest_release(repo):
              data = api_with_retry(
                  f"repos/{repo}/releases/latest",
                  allow_404=True,
              )

              if not isinstance(data, dict):
                  return {
                      "tag": "none",
                      "sha": "none",
                      "data": None,
                  }

              tag = data.get("tag_name") or "none"
              sha = "none"

              if tag != "none":
                  ref = api_with_retry(
                      f"repos/{repo}/git/ref/tags/"
                      f"{quote(tag, safe='')}",
                      allow_404=True,
                  )

                  if isinstance(ref, dict):
                      obj = ref.get("object", {})
                      sha = obj.get("sha", "none")
                      kind = obj.get("type")

                      # Dereference annotated tags.
                      while kind == "tag" and sha != "none":
                          tag_obj = api_with_retry(
                              f"repos/{repo}/git/tags/{sha}",
                              allow_404=True,
                          )
                          if not isinstance(tag_obj, dict):
                              sha = "none"
                              break
                          obj = tag_obj.get("object", {})
                          sha = obj.get("sha", "none")
                          kind = obj.get("type")

              return {
                  "tag": tag,
                  "sha": sha,
                  "data": data,
              }

          def download(url, output):
              # Download exactly one file. No other repository's
              # temporary files are retained.
              p = run(
                  [
                      "curl",
                      "-fLsS",
                      "--retry", "3",
                      "--retry-delay", "2",
                      "-H", f"Authorization: Bearer {TOKEN}",
                      "-H", "Accept: application/vnd.github+json",
                      url,
                      "-o", str(output),
                  ],
                  check=False,
              )

              if p.returncode:
                  err = (
                      (p.stderr or "").strip()
                      or (p.stdout or "").strip()
                      or "<no output>"
                  ).replace(TOKEN, "***")

                  if is_permanent_error(err):
                      output.unlink(missing_ok=True)
                      raise PermanentSkip(
                          f"download disabled for {url}: {err}"
                      )

                  raise RuntimeError(
                      f"curl failed for {url}: {err}"
                  )

              size = output.stat().st_size

              if size == 0:
                  output.unlink(missing_ok=True)
                  raise RuntimeError(
                      f"Downloaded file is empty: {output.name}"
                  )

              if size > MAX_ASSET_SIZE:
                  output.unlink(missing_ok=True)
                  raise RuntimeError(
                      f"File exceeds safe upload limit: "
                      f"{output.name} ({size} bytes)"
                  )

          def upload_one(tag, file):
              # Upload immediately, then delete the local file.
              run([
                  "gh",
                  "release",
                  "upload",
                  tag,
                  str(file),
                  "--repo", TARGET,
              ])
              file.unlink(missing_ok=True)
              print(f"Uploaded and removed: {file.name}")

          def persist_tracking():
              lines = [
                  "commit-tracking: "
                  + datetime.now(timezone.utc).strftime(
                      "%Y-%m-%d %H:%M"
                  )
              ]

              for repo in sorted(records):
                  item = records[repo]
                  branches = ";".join(
                      f"{name}:{sha}"
                      for name, sha in item["branches"].items()
                  )
                  lines.append(
                      f"{repo}: BRANCHES:[{branches}]"
                      f"|RELEASE:[{item['release']}"
                      f"|{item['release_sha']}]"
                  )

              TRACKING.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

              run(["git", "add", "commit-trackingc.yaml"])

              diff = run(
                  ["git", "diff", "--cached", "--quiet"],
                  check=False,
              )

              if diff.returncode == 0:
                  print("Tracking file unchanged.")
                  return

              run([
                  "git", "commit", "-m",
                  "Update commit-trackingc.yaml [skip ci]",
              ])

              run([
                  "git", "push", "origin",
                  f"HEAD:refs/heads/{TARGET_BRANCH}",
              ])

              print("Tracking file synchronized.")

          # ------------------------------------------------------------
          # Load config
          # ------------------------------------------------------------
          with CONFIG.open(encoding="utf-8") as f:
              config = yaml.safe_load(f) or {}

          excludes = {
              x.lower()
              for x in config.get("exclude", [])
              if isinstance(x, str)
          }

          # Each batch:
          #   (label, repos, sync_per_repo)
          #
          # sync_per_repo=False  -> sync tracking once at end of batch
          #                         (allrepositories / repositories.repoN)
          # sync_per_repo=True   -> sync tracking immediately after
          #                         each repo (onebyonerepositories)
          batches = []

          # 1. allrepositories: one owner per batch, batch-level sync.
          for owner in config.get("allrepositories", []) or []:
              if not isinstance(owner, str):
                  continue

              owner = owner.strip()

              if not re.fullmatch(
                  r"[A-Za-z0-9_.-]+", owner
              ):
                  print(f"Invalid owner skipped: {owner}")
                  continue

              try:
                  batches.append((
                      f"owner:{owner}",
                      owner_repositories(owner),
                      False,
                  ))
              except PermanentSkip as exc:
                  print(
                      f"SKIPPED (permanent): owner {owner}: {exc}",
                      file=sys.stderr,
                  )

          # 2. onebyonerepositories: expand each owner into one
          #    batch per repo, with per-repo tracking sync.
          for owner in config.get("onebyonerepositories", []) or []:
              if not isinstance(owner, str):
                  continue

              owner = owner.strip()

              if not re.fullmatch(
                  r"[A-Za-z0-9_.-]+", owner
              ):
                  print(
                      f"Invalid onebyone owner skipped: {owner}"
                  )
                  continue

              try:
                  owner_repos = owner_repositories(owner)
              except PermanentSkip as exc:
                  print(
                      f"SKIPPED (permanent): owner {owner}: {exc}",
                      file=sys.stderr,
                  )
                  continue

              for repo in owner_repos:
                  batches.append((
                      f"onebyone:{repo}",
                      [repo],
                      True,
                  ))

          # 3. repositories.repoN groups, batch-level sync.
          groups = config.get("repositories", {})

          for key, values in groups.items():
              if not re.fullmatch(r"repo\d+", str(key)):
                  continue

              if not isinstance(values, list):
                  continue

              repos = []
              for value in values:
                  repo = valid_repo(value)
                  if repo:
                      repos.append(repo)

              batches.append((
                  f"repositories.{key}",
                  repos,
                  False,
              ))

          # Exclude and deduplicate repositories across batches.
          seen = set()
          clean_batches = []

          for label, repos, sync_per_repo in batches:
              clean = []

              for repo in repos:
                  if repo.lower() in excludes:
                      print(f"Excluded: {repo}")
                      continue

                  if repo.lower() in seen:
                      print(f"Duplicate skipped: {repo}")
                      continue

                  seen.add(repo.lower())
                  clean.append(repo)

              if clean:
                  clean_batches.append(
                      (label, clean, sync_per_repo)
                  )

          print(f"Total batches: {len(clean_batches)}")
          print(f"Total repositories: {len(seen)}")

          # ------------------------------------------------------------
          # Read existing commit-trackingc.yaml.
          # Legacy format:
          # repo: BRANCHES:[name:sha;...]|RELEASE:[tag|sha]
          # ------------------------------------------------------------
          records = {}

          if TRACKING.exists():
              for line in TRACKING.read_text(
                  encoding="utf-8"
              ).splitlines():

                  if line.startswith("commit-tracking:"):
                      continue

                  match = re.match(
                      r"^([^:]+): BRANCHES:\[(.*)\]"
                      r"\|RELEASE:\[(.*)\]\s*$",
                      line,
                  )

                  if not match:
                      continue

                  repo, branch_text, release_text = (
                      match.groups()
                  )
                  branches = {}

                  for item in branch_text.split(";"):
                      if ":" in item:
                          name, sha = item.rsplit(":", 1)
                          if name and sha:
                              branches[name] = sha

                  parts = release_text.split("|", 1)

                  records[repo] = {
                      "branches": branches,
                      "release": parts[0],
                      "release_sha": (
                          parts[1]
                          if len(parts) > 1
                          else "none"
                      ),
                  }

          # ------------------------------------------------------------
          # Rate limit pre-check
          # ------------------------------------------------------------
          check_rate_limit()

          failures = []
          skipped = []

          # Every repository gets its own temporary directory.
          # finally always attempts cleanup, including on failure.
          for batch_index, (
              label,
              repos,
              sync_per_repo,
          ) in enumerate(clean_batches, 1):

              mode = "per-repo-sync" if sync_per_repo else "batch-sync"
              print("\n" + "=" * 70)
              print(
                  f"BATCH {batch_index}/{len(clean_batches)}: "
                  f"{label} [{mode}]"
              )
              print(f"Repositories: {len(repos)}")
              print("=" * 70)

              batch_completed = 0
              batch_failed = []
              batch_skipped = []

              for repo_index, repo in enumerate(repos, 1):
                  print(
                      f"\n[{repo_index}/{len(repos)}] {repo}"
                  )

                  work = None
                  created_tag = None
                  backup_succeeded = False

                  try:
                      work = Path(tempfile.mkdtemp(
                          prefix="repo-backup-"
                      ))

                      disk_status(f"before {repo}")

                      ranked = get_branches(repo)

                      current_branches = {
                          b["name"]: b["sha"]
                          for b in ranked
                      }

                      release = latest_release(repo)

                      previous = records.get(repo, {
                          "branches": {},
                          "release": "none",
                          "release_sha": "none",
                      })

                      old_branches = previous["branches"]

                      changed = [
                          b for b in ranked
                          if old_branches.get(b["name"])
                          != b["sha"]
                      ]

                      release_changed = (
                          release["tag"] != previous["release"]
                          or release["sha"]
                          != previous["release_sha"]
                      )

                      if not changed and not release_changed:
                          print(
                              "No changes; backup skipped."
                          )
                          records[repo] = {
                              "branches": current_branches,
                              "release": release["tag"],
                              "release_sha": release["sha"],
                          }
                          backup_succeeded = True
                      else:
                          stamp = datetime.now(
                              timezone.utc
                          ).strftime("%Y%m%d-%H%M%S")

                          slug = safe_name(
                              repo.replace("/", "-")
                          )
                          created_tag = (
                              f"backup-{slug}-{stamp}"
                          )

                          notes = (
                              f"Source: "
                              f"https://github.com/{repo}\n"
                              f"Changed branches: "
                              f"{len(changed)}\n"
                              f"Latest release changed: "
                              f"{release_changed}\n"
                              f"Generated at: {stamp} UTC\n"
                          )

                          has_files = bool(changed) or (
                              release_changed
                              and release["data"] is not None
                          )

                          if has_files:
                              run([
                                  "gh",
                                  "release",
                                  "create",
                                  created_tag,
                                  "--repo", TARGET,
                                  "--title",
                                  f"Backup {repo} {stamp}",
                                  "--notes", notes,
                                  "--draft",
                              ])

                          checksum_lines = []
                          uploaded_count = 0

                          def backup_and_upload(url, filename):
                              output = work / safe_name(filename)
                              try:
                                  download(url, output)

                                  digest = hashlib.sha256()
                                  with output.open("rb") as stream:
                                      for chunk in iter(
                                          lambda: stream.read(
                                              1024 * 1024
                                          ),
                                          b"",
                                      ):
                                          digest.update(chunk)

                                  checksum_lines.append(
                                      f"{digest.hexdigest()}  "
                                      f"{output.name}"
                                  )

                                  upload_one(
                                      created_tag, output
                                  )
                              finally:
                                  output.unlink(missing_ok=True)

                          for branch in changed:
                              name = branch["name"]
                              sha = branch["sha"]

                              filename = (
                                  f"branch-{safe_name(name)}-"
                                  f"{sha[:12]}.tar.gz"
                              )

                              backup_and_upload(
                                  f"https://api.github.com/repos/"
                                  f"{repo}/tarball/{sha}",
                                  filename,
                              )

                              uploaded_count += 1
                              disk_status(
                                  f"after branch "
                                  f"{repo}/{name}"
                              )

                          if (
                              release_changed
                              and release["data"]
                          ):
                              tag_name = release["tag"]

                              if tag_name != "none":
                                  backup_and_upload(
                                      f"https://api.github.com/"
                                      f"repos/{repo}/tarball/"
                                      f"{quote(tag_name, safe='')}",
                                      f"release-"
                                      f"{safe_name(tag_name)}"
                                      f".tar.gz",
                                  )
                                  uploaded_count += 1

                              for asset in release["data"].get(
                                  "assets", []
                              ):
                                  url = asset.get(
                                      "browser_download_url"
                                  )
                                  name = asset.get("name")

                                  if not url or not name:
                                      continue

                                  backup_and_upload(
                                      url,
                                      f"asset-{name}",
                                  )

                                  uploaded_count += 1
                                  disk_status(
                                      f"after release asset "
                                      f"{repo}/{name}"
                                  )

                          if has_files and checksum_lines:
                              manifest = (
                                  work / "SHA256SUMS.txt"
                              )
                              manifest.write_text(
                                  "\n".join(checksum_lines)
                                  + "\n",
                                  encoding="utf-8",
                              )
                              upload_one(
                                  created_tag, manifest
                              )

                          if has_files:
                              run([
                                  "gh",
                                  "release",
                                  "edit",
                                  created_tag,
                                  "--repo", TARGET,
                                  "--draft=false",
                              ])

                          records[repo] = {
                              "branches": current_branches,
                              "release": release["tag"],
                              "release_sha": release["sha"],
                          }
                          backup_succeeded = True
                          print(
                              f"Repository completed: {repo}"
                          )

                  except PermanentSkip as exc:
                      print(
                          f"SKIPPED (permanent): {repo}: {exc}",
                          file=sys.stderr,
                      )
                      skipped.append(repo)
                      batch_skipped.append(repo)

                      if created_tag:
                          run(
                              [
                                  "gh",
                                  "release",
                                  "delete",
                                  created_tag,
                                  "--repo", TARGET,
                                  "--cleanup-tag",
                                  "--yes",
                              ],
                              check=False,
                          )

                  except Exception as exc:
                      print(
                          f"FAILED: {repo}: {exc}",
                          file=sys.stderr,
                      )
                      failures.append(repo)
                      batch_failed.append(repo)

                      if created_tag:
                          run(
                              [
                                  "gh",
                                  "release",
                                  "delete",
                                  created_tag,
                                  "--repo", TARGET,
                                  "--cleanup-tag",
                                  "--yes",
                              ],
                              check=False,
                          )

                  finally:
                      if work is not None:
                          shutil.rmtree(
                              work, ignore_errors=True
                          )
                          print(
                              f"Temporary directory cleaned: "
                              f"{repo}"
                          )

                      disk_status(f"after cleanup {repo}")

                  # ------------------------------------------------------
                  # Per-repo tracking sync:
                  # For onebyonerepositories, push immediately after
                  # each successful repo (success or no-change skip).
                  # ------------------------------------------------------
                  if sync_per_repo and backup_succeeded:
                      print(
                          f"\nSynchronizing tracking after "
                          f"repo: {repo}"
                      )
                      try:
                          persist_tracking()
                      except Exception as exc:
                          print(
                              f"TRACKING PUSH FAILED: {exc}",
                              file=sys.stderr,
                          )
                          sys.exit(1)

                  if backup_succeeded:
                      batch_completed += 1

              # ----------------------------------------------------------
              # Batch-level tracking sync:
              # Only for non-per-repo batches.
              # ----------------------------------------------------------
              if not sync_per_repo:
                  if batch_completed:
                      print(
                          f"\nSynchronizing tracking after "
                          f"batch: {label}"
                      )
                      try:
                          persist_tracking()
                      except Exception as exc:
                          print(
                              f"TRACKING PUSH FAILED: {exc}",
                              file=sys.stderr,
                          )
                          sys.exit(1)
                  else:
                      print(
                          f"No successful repositories in "
                          f"{label}; tracking not synchronized."
                      )
              else:
                  # onebyone batch: tracking already synced per repo.
                  if batch_completed:
                      print(
                          f"\nPer-repo tracking synchronized for "
                          f"{batch_completed} repo(s) in "
                          f"batch: {label}"
                      )
                  else:
                      print(
                          f"No successful repositories in "
                          f"{label}; tracking not synchronized."
                      )

              if batch_skipped:
                  print(
                      f"Batch had permanent skips: "
                      f"{', '.join(batch_skipped)}"
                  )

              if batch_failed:
                  print(
                      f"Batch had failures: "
                      f"{', '.join(batch_failed)}"
                  )

          # ------------------------------------------------------------
          # Final summary
          # ------------------------------------------------------------
          if skipped:
              print(
                  f"\nPermanently skipped "
                  f"({len(skipped)}): "
                  + ", ".join(skipped),
                  file=sys.stderr,
              )

          if failures:
              print(
                  f"\nFailed repositories "
                  f"({len(failures)}): "
                  + ", ".join(failures),
                  file=sys.stderr,
              )
              sys.exit(1)

          if skipped:
              print(
                  "\nAll batches completed; "
                  f"{len(skipped)} repositories permanently "
                  "skipped (not counted as failures)."
              )
          else:
              print("\nAll batches completed successfully.")
          PY