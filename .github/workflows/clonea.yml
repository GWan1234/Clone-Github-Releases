name: Clone Backup Repositories A

on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_TOKEN }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq p7zip-full coreutils bc || \
          sudo apt-get install -y jq 7zip coreutils bc
          # yq / gh / git / curl 已预装在 runner 镜像中

      - name: Run backup
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          set -uo pipefail
          export GIT_TERMINAL_PROMPT=0
          shopt -s nullglob globstar

          # =========================
          # 时间配置
          # =========================
          NOW_DATE=$(date +"%Y%m%d")
          NOW_TIME=$(date +"%H%M")
          NOW_HUMAN=$(date +"%Y-%m-%d %H:%M")
          TRACKING_FILE="commit-tracking-a-${NOW_DATE}.yaml"

          # =========================
          # 历史基线选择：严格排除「当天」文件
          # =========================
          LAST_TRACKING_FILE=$(ls -1 commit-tracking-a-*.yaml 2>/dev/null \
            | grep -v -- "commit-tracking-a-${NOW_DATE}.yaml" \
            | sort -r | head -n1 || true)

          # 若今天的文件不存在，从历史基线复制作为初始状态
          # 目的：即使当天工作流中途失败，也不会让后续运行误判「从未备份」→ 强制全量
          if [[ ! -f "$TRACKING_FILE" && -n "$LAST_TRACKING_FILE" && -f "$LAST_TRACKING_FILE" ]]; then
            echo "📋 Initializing today's tracking from: $LAST_TRACKING_FILE"
            cp "$LAST_TRACKING_FILE" "$TRACKING_FILE"
          fi

          # =========================
          # 全局统计
          # =========================
          TOTAL_SUCCESS=0
          TOTAL_FAILED=0

          # =========================
          # 工具函数
          # =========================
          safe() {
            local v="${1:-unknown}"
            if [[ -z "$v" || "$v" == "null" || "$v" == "-" || "$v" == "none" ]]; then
              echo "unknown"
            else
              echo "$v"
            fi
          }

          sanitize() {
            echo "$1" \
              | tr '/' '-' \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9._-]/-/g' \
              | sed 's/-\+/-/g' \
              | sed 's/^-//;s/-$//'
          }

          cleanup() {
            rm -rf tmp *.7z* *.sha256 up-* core.* .DS_Store 2>/dev/null || true
          }

          auth_url() {
            echo "https://x-access-token:${GITHUB_TOKEN}@github.com/$1.git"
          }

          # 每个仓库只调用一次（结果复用）
          fetch_repo_info() {
            curl -fsSL --retry 2 --max-time 15 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/$1" \
              2>/dev/null || echo '{}'
          }

          fetch_latest_release() {
            curl -fsSL --retry 2 --max-time 15 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/$1/releases/latest" \
              2>/dev/null || echo '{}'
          }

          release_exists() {
            gh release view "$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          }

          human_size() {
            numfmt --to=iec --suffix=B "$1" 2>/dev/null || echo "0B"
          }

          safe_upload() {
            local file="$1"
            local tag="$2"
            if [[ -f "$file" && -s "$file" ]]; then
              echo "Uploading: $file"
              if ! gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                echo "❌ UPLOAD FAILED: $file"
                return 1
              fi
            fi
            return 0
          }

          set_tracking() {
            local repo="$1"
            local state="$2"
            yq -i --arg repo "$repo" --arg state "$state" '.[$repo] = $state' "$TRACKING_FILE" 2>/dev/null || true
          }

          # =========================================================
          # 同步 tracking 文件：
          #   - 先 diff，无变化跳过
          #   - 只 add/commit TRACKING_FILE，不污染工作区其它文件
          #   - 只有确有本地未推送的提交才 push
          # =========================================================
          sync_tracking() {
            echo -e "\n💾 Syncing tracking file..."
            git config --global user.name "Action"
            git config --global user.email "action@github.com"

            local branch="${GITHUB_REF_NAME:-main}"
            git checkout "$branch" 2>/dev/null || git checkout main 2>/dev/null || true

            # 只暂存 tracking 文件
            git add -- "$TRACKING_FILE"

            # 有 diff 才 commit
            if ! git diff --cached --quiet -- "$TRACKING_FILE"; then
              git commit -m "track sync: $NOW_HUMAN" -- "$TRACKING_FILE" >/dev/null
            else
              echo "ℹ️ No tracking changes to commit"
            fi

            # 是否还有未推送的提交？
            git fetch origin "$branch" >/dev/null 2>&1 || true
            local ahead
            ahead=$(git rev-list --count "origin/$branch..HEAD" 2>/dev/null || echo 0)
            if [[ "$ahead" == "0" ]]; then
              echo "ℹ️ Tracking already up-to-date"
              return 0
            fi

            if ! git pull --rebase origin "$branch" >/dev/null 2>&1; then
              echo "❌ Tracking pull/rebase failed"
              return 1
            fi
            if ! git push origin HEAD >/dev/null 2>&1; then
              echo "❌ Tracking push failed"
              return 1
            fi
            echo "✅ Tracking file synced"
            return 0
          }

          # =========================================================
          # 状态快照：完全基于本地 mirror，不再调用 git ls-remote
          # =========================================================
          get_repo_current_state() {
            local mirror="$1"
            local release_json="$2"

            local branch_states=""
            local count=0

            while read -r name sha; do
              [[ $count -ge 10 ]] && break
              branch_states+="${name}:${sha};"
              count=$((count + 1))
            done < <(
              git -C "$mirror" for-each-ref \
                --sort=-committerdate \
                --format='%(refname:short) %(objectname)' \
                refs/heads 2>/dev/null || true
            )

            local rel_tag rel_commit
            rel_tag=$(echo "$release_json" | jq -r '.tag_name // "none"' 2>/dev/null || echo "none")

            if [[ "$rel_tag" != "none" ]]; then
              # 直接用本地镜像的 tag（annotated tag 用 ^{commit} 解引用）
              rel_commit=$(git -C "$mirror" rev-parse "refs/tags/${rel_tag}^{commit}" 2>/dev/null \
                        || git -C "$mirror" rev-parse "refs/tags/${rel_tag}" 2>/dev/null \
                        || echo "none")
            else
              rel_commit="none"
            fi

            echo "BRANCHES:[${branch_states}]|RELEASE:[${rel_tag}|${rel_commit}]"
          }

          # =========================================================
          # 是否需要备份：对比今天的 tracking 文件（已含今日进度）
          # - 没文件 → 首次全量
          # - 有文件 → 严格按 state 比较
          # =========================================================
          need_backup() {
            local repo="$1"
            local current_state="$2"

            if [[ ! -f "$TRACKING_FILE" ]]; then
              echo "🔴 No baseline file → force backup"
              return 0
            fi

            local last_state
            last_state=$(yq -r --arg repo "$repo" '.[$repo] // ""' "$TRACKING_FILE" 2>/dev/null || true)

            if [[ "$last_state" != "$current_state" ]]; then
              return 0
            fi
            return 1
          }

          build_notes() {
            REPO="$1"; REPO_JSON="$2"; BRANCH_COUNT="$3"
            ARCHIVE_SIZE="$4"; RELEASE_TIME="$5"; UPSTREAM_JSON="$6"

            REPO_URL=$(safe "$(echo "$REPO_JSON" | jq -r '.html_url // "unknown"' 2>/dev/null)")
            DESC=$(safe "$(echo "$REPO_JSON" | jq -r '.description // "none"' 2>/dev/null)")
            DEF_BRANCH=$(safe "$(echo "$REPO_JSON" | jq -r '.default_branch // "unknown"' 2>/dev/null)")
            LANG=$(safe "$(echo "$REPO_JSON" | jq -r '.language // "unknown"' 2>/dev/null)")
            STARS=$(safe "$(echo "$REPO_JSON" | jq -r '.stargazers_count // 0' 2>/dev/null)")
            FORKS=$(safe "$(echo "$REPO_JSON" | jq -r '.forks_count // 0' 2>/dev/null)")
            CREATED=$(safe "$(echo "$REPO_JSON" | jq -r '.created_at // "unknown"' 2>/dev/null)")
            UPDATED=$(safe "$(echo "$REPO_JSON" | jq -r '.updated_at // "unknown"' 2>/dev/null)")
            PUSHED=$(safe "$(echo "$REPO_JSON" | jq -r '.pushed_at // "unknown"' 2>/dev/null)")
            UP_TAG=$(safe "$(echo "$UPSTREAM_JSON" | jq -r '.tag_name // "none"' 2>/dev/null)")
            UP_NAME=$(safe "$(echo "$UPSTREAM_JSON" | jq -r '.name // "none"' 2>/dev/null)")
            UP_TIME=$(safe "$(echo "$UPSTREAM_JSON" | jq -r '.published_at // "none"' 2>/dev/null)")

            printf -- "## 📦 Repository Info\n"
            printf -- "- URL: %s\n" "$REPO_URL"
            printf -- "- Description: %s\n" "$DESC"
            printf -- "- Default branch: %s\n" "$DEF_BRANCH"
            printf -- "- Language: %s\n" "$LANG"
            printf -- "- Stars: %s | Forks: %s\n" "$STARS" "$FORKS"
            printf -- "\n## 🕒 Source Timeline\n"
            printf -- "- Created: %s\n" "$CREATED"
            printf -- "- Updated: %s\n" "$UPDATED"
            printf -- "- Pushed: %s\n" "$PUSHED"
            printf -- "\n## 🏷 Upstream Release\n"
            printf -- "- Tag: %s\n" "$UP_TAG"
            printf -- "- Name: %s\n" "$UP_NAME"
            printf -- "- Published: %s\n" "$UP_TIME"
            printf -- "\n## 📊 Backup Info\n"
            printf -- "- Branch count: %s\n" "$BRANCH_COUNT"
            printf -- "- Archive size: %s\n" "$(human_size "$ARCHIVE_SIZE")"
            printf -- "- Backup time: %s\n" "$RELEASE_TIME"
            printf -- "\n## 🔍 Incremental Backup\n"
            printf -- "- Track 10 latest branches commits (sorted by commit time)\n"
            printf -- "- Track latest release commit & tag\n"
            printf -- "- Backup triggered by any change"
          }

          # =========================================================
          # 获取用户/组织全部 public repo
          # =========================================================
          get_all_repos() {
            local owner="$1"
            local user_info type
            user_info=$(curl -sSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/users/$owner")
            type=$(echo "$user_info" | jq -r '.type // empty')

            if [[ -z "$type" ]]; then
              echo "❌ Could not resolve owner type: $owner" >&2
              return 0
            fi

            local api_endpoint
            if [[ "$type" == "Organization" ]]; then
              api_endpoint="orgs/$owner/repos"
            else
              api_endpoint="users/$owner/repos"
            fi

            local page=1 max_pages=20
            while [[ $page -le $max_pages ]]; do
              local data count
              data=$(curl -sSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "https://api.github.com/${api_endpoint}?per_page=100&page=$page")
              if [[ "$(echo "$data" | jq 'type')" != '"array"' ]]; then
                echo "❌ API Error for $owner page $page" >&2
                break
              fi
              count=$(echo "$data" | jq 'length')
              [[ "$count" == "0" ]] && break
              echo "$data" | jq -r '.[] | select(.private==false) | .full_name'
              page=$((page + 1))
            done
          }

          # =========================================================
          # 备份单个仓库
          # =========================================================
          backup_repo() {
            local REPO="$1"
            echo -e "\n====================================="
            echo "==== BACKUP: $REPO ===="
            echo "====================================="

            cleanup
            mkdir -p tmp
            local error_occurred=0

            local REPO_SLUG TAG
            REPO_SLUG=$(sanitize "$REPO")
            TAG=$(sanitize "${REPO_SLUG}-${NOW_DATE}-${NOW_TIME}" | cut -c1-120)

            if release_exists "$TAG"; then
              echo "⚠️ Release $TAG already exists, recreating..."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
            fi

            # 每个仓库只取一次 API 信息
            local REPO_JSON UPSTREAM_JSON
            REPO_JSON=$(fetch_repo_info "$REPO")
            UPSTREAM_JSON=$(fetch_latest_release "$REPO")

            local MIRROR EXPORT
            MIRROR="tmp/${REPO_SLUG}.git"
            EXPORT="tmp/export/${REPO_SLUG}"
            mkdir -p "$EXPORT"

            echo "🔽 Cloning repository..."
            if ! git clone --mirror "$(auth_url "$REPO")" "$MIRROR" >/dev/null 2>&1; then
              echo "❌ Clone failed, skip repo"
              TOTAL_FAILED=$((TOTAL_FAILED + 1))
              cleanup
              return 0
            fi

            # 状态快照：基于本地镜像（无 ls-remote）
            local CURRENT_STATE
            CURRENT_STATE=$(get_repo_current_state "$MIRROR" "$UPSTREAM_JSON")

            # 只有在需要备份时才走归档流程
            if ! need_backup "$REPO" "$CURRENT_STATE"; then
              echo "✅ Skip: $REPO (no changes)"
              cleanup
              return 0
            fi
            echo "🔴 Changes detected → backup"

            # TOP10 最近提交的分支
            local BRANCHES=()
            mapfile -t BRANCHES < <(
              git -C "$MIRROR" for-each-ref \
                --sort=-committerdate \
                --format='%(refname:short)' \
                refs/heads 2>/dev/null || true
            )
            BRANCHES=("${BRANCHES[@]:0:10}")

            if [[ ${#BRANCHES[@]} -eq 0 ]]; then
              echo "❌ No branches found, skip"
              cleanup
              return 0
            fi

            echo "📦 Packaging ${#BRANCHES[@]} branches (TOP10 latest)..."
            local FILES=() IDX=0

            for B in "${BRANCHES[@]}"; do
              local B_SLUG DIR ARCHIVE
              B_SLUG=$(sanitize "$B")
              DIR="${EXPORT}/${B_SLUG}"
              mkdir -p "$DIR"

              git -C "$MIRROR" archive "$B" | tar -xf - -C "$DIR" 2>/dev/null || continue

              ARCHIVE="${REPO_SLUG}-${B_SLUG}-${IDX}.7z"
              7z a -t7z -mx5 -mmt2 -v1500m "$ARCHIVE" "$DIR" >/dev/null 2>&1 || true

              for f in "${ARCHIVE}"*; do
                if [[ -f "$f" && -s "$f" && "$f" != *.sha256 ]]; then
                  sha256sum "$f" > "${f}.sha256" 2>/dev/null || true
                  FILES+=("$f" "${f}.sha256")
                fi
              done
              IDX=$((IDX + 1))
            done

            if [[ ${#FILES[@]} -eq 0 ]]; then
              echo "❌ No packages generated, skip release"
              TOTAL_FAILED=$((TOTAL_FAILED + 1))
              cleanup
              return 0
            fi

            local TOTAL_SIZE=0
            for f in *.7z*; do
              [[ -f "$f" && "$f" != *.sha256 ]] && \
                TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f" 2>/dev/null || echo 0)))
            done

            echo "🚀 Creating release: $TAG"
            local NOTES_FILE
            NOTES_FILE=$(mktemp)
            build_notes "$REPO" "$REPO_JSON" "${#BRANCHES[@]}" "$TOTAL_SIZE" "$NOW_HUMAN" "$UPSTREAM_JSON" > "$NOTES_FILE"

            local FIRST_FILE="${FILES[0]}"
            if ! gh release create "$TAG" "$FIRST_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$REPO_SLUG ($NOW_HUMAN)" \
              --notes-file "$NOTES_FILE" 2>/dev/null; then
              echo "❌ Release create failed → cleaning up..."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
              error_occurred=1
              rm -f "$NOTES_FILE"
              cleanup
              TOTAL_FAILED=$((TOTAL_FAILED + 1))
              return 0
            fi
            echo "✅ Release created"

            echo "📤 Uploading ${#FILES[@]} files..."
            for ((i=1; i<${#FILES[@]}; i++)); do
              safe_upload "${FILES[$i]}" "$TAG" || error_occurred=1
            done

            echo "🔗 Syncing upstream assets..."
            local ASSETS_DATA
            ASSETS_DATA=$(echo "$UPSTREAM_JSON" | jq -c '.assets[]? | select(.name != null and .browser_download_url != null)' 2>/dev/null || true)
            if [[ -n "$ASSETS_DATA" ]]; then
              while read -r asset; do
                [[ -z "$asset" ]] && continue
                local ASSET_NAME ASSET_URL
                ASSET_NAME=$(echo "$asset" | jq -r '.name' 2>/dev/null || continue)
                ASSET_URL=$(echo "$asset" | jq -r '.browser_download_url' 2>/dev/null || continue)
                echo "--> Asset: $ASSET_NAME"
                curl -LSs --retry 1 --max-time 30 -o "up-$ASSET_NAME" "$ASSET_URL" 2>/dev/null || continue
                if [[ -f "up-$ASSET_NAME" && -s "up-$ASSET_NAME" ]]; then
                  safe_upload "up-$ASSET_NAME" "$TAG" || error_occurred=1
                fi
                rm -f "up-$ASSET_NAME"
              done <<< "$ASSETS_DATA"
            fi

            rm -f "$NOTES_FILE"

            if [[ $error_occurred -eq 0 ]]; then
              echo "✅ Backup 100% SUCCESS → writing tracking"
              set_tracking "$REPO" "$CURRENT_STATE"
              TOTAL_SUCCESS=$((TOTAL_SUCCESS + 1))
            else
              echo "❌ Backup FAILED → NO tracking write"
              TOTAL_FAILED=$((TOTAL_FAILED + 1))
            fi

            cleanup
          }

          # =========================================================
          # 主流程
          # =========================================================
          process_all() {
            local excluded_repos=()
            mapfile -t excluded_repos < <(
              yq -r '.exclude[]?' repositoriesa.yaml 2>/dev/null \
                | grep -v '^[[:space:]]*#' \
                | sed '/^[[:space:]]*$/d' || true
            )

            is_excluded() {
              local repo="$1"
              local ex
              for ex in "${excluded_repos[@]}"; do
                [[ "$repo" == "$ex" ]] && return 0
              done
              return 1
            }

            # 1) 按 owner 扫描
            local OWNERS=()
            mapfile -t OWNERS < <(
              yq -r '.allrepositories[]?' repositoriesa.yaml 2>/dev/null \
                | grep -v '^[[:space:]]*#' \
                | sed '/^[[:space:]]*$/d' || true
            )

            local O
            for O in "${OWNERS[@]}"; do
              [[ -z "$O" ]] && continue
              echo -e "\n====================================="
              echo "==== Scanning owner: $O ===="
              echo "====================================="

              local REPOS=()
              mapfile -t REPOS < <(get_all_repos "$O" | grep -v '^$' || true)
              if [[ ${#REPOS[@]} -eq 0 ]]; then
                echo "ℹ️ No public repos found"; continue
              fi

              local R
              for R in "${REPOS[@]}"; do
                if is_excluded "$R"; then
                  echo "⛔ Excluded: $R"
                  continue
                fi
                backup_repo "$R"
              done

              # ✅ 该 owner 处理完毕 → 立即同步 tracking
              echo -e "\n📤 Sync tracking after owner: $O"
              sync_tracking || echo "❌ Sync failed after owner: $O"
            done

            # 2) 手动指定仓库组
            echo -e "\n====================================="
            echo "==== Processing manual repositories ===="
            echo "====================================="

            local ALL_KEYS=()
            mapfile -t ALL_KEYS < <(
              yq -r '.repositories | keys[]' repositoriesa.yaml 2>/dev/null \
                | grep -v '^[[:space:]]*#' \
                | sed '/^[[:space:]]*$/d' || true
            )

            local KEY
            for KEY in "${ALL_KEYS[@]}"; do
              echo "➡️ Group: $KEY"
              local REPOS=()
              mapfile -t REPOS < <(
                yq -r --arg key "$KEY" '.repositories[$key] // [] | .[]' repositoriesa.yaml 2>/dev/null \
                  | grep -v '^[[:space:]]*#' \
                  | sed '/^[[:space:]]*$/d' || true
              )

              local R
              for R in "${REPOS[@]}"; do
                [[ -z "$R" ]] && continue
                if is_excluded "$R"; then
                  echo "⛔ Excluded: $R"
                  continue
                fi
                backup_repo "$R"
              done

              # ✅ 该组处理完毕 → 立即同步 tracking
              echo -e "\n📤 Sync tracking after group: $KEY"
              sync_tracking || echo "❌ Sync failed after group: $KEY"
            done
          }

          # 运行主流程
          process_all

          # 最后一次兜底同步（防止循环内同步失败遗漏）
          echo -e "\n📤 Final sync..."
          sync_tracking || true

          # 汇总
          echo -e "\n====================================="
          echo "📊 Summary: ✅ $TOTAL_SUCCESS succeeded | ❌ $TOTAL_FAILED failed"
          echo "====================================="

          if [[ $TOTAL_FAILED -gt 0 ]]; then
            echo "❌ Some repositories failed, exiting non-zero"
            exit 1
          fi
          echo "🎉 All done"