
name: Clone Backup Repositories A

on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-backup-repositories-a
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_TOKEN }}

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          gh auth status
          python3 --version
          df -h

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Backup repositories by batch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import sys
          import json
          import yaml
          import hashlib
          import subprocess
          import tempfile
          import shutil
          import re
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote

          TOKEN = os.environ["GH_TOKEN"]
          TARGET = os.environ["GH_REPO"]
          TARGET_BRANCH = os.environ["GH_BRANCH"]

          CONFIG = Path("repositoriesa.yaml")
          TRACKING = Path("commit-tracking.yaml")

          # Keep uploaded assets below GitHub's per-file limit.
          MAX_ASSET_SIZE = 1900 * 1024 * 1024

          def run(args, check=True, cwd=None):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  cwd=cwd,
              )
              if check and p.returncode:
                  raise RuntimeError(
                      f"Command failed: {' '.join(map(str, args))}\n"
                      f"{p.stderr}"
                  )
              return p

          def api(endpoint):
              p = run(["gh", "api", endpoint], check=False)

              if p.returncode:
                  return None

              try:
                  return json.loads(p.stdout)
              except (ValueError, TypeError):
                  return None

          def valid_repo(value):
              if not isinstance(value, str):
                  return None

              value = value.strip().rstrip("/")
              value = re.sub(
                  r"^https?://github\.com/",
                  "",
                  value,
              )
              value = re.sub(r"\.git$", "", value)

              if re.fullmatch(
                  r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",
                  value,
              ):
                  return value

              return None

          def safe_name(value):
              value = re.sub(
                  r"[^A-Za-z0-9_.-]",
                  "_",
                  str(value),
              )
              return value[:140] or "unnamed"

          def disk_status(label):
              print(f"\n=== Disk usage: {label} ===")
              run(["df", "-h", "/tmp"])
              run(["df", "-i", "/tmp"])

          def owner_repositories(owner):
              # Support both organizations and user accounts.
              for prefix in ("orgs", "users"):
                  result = []
                  page = 1
                  valid = True

                  while True:
                      endpoint = (
                          f"{prefix}/{quote(owner, safe='')}/repos"
                          f"?type=all&per_page=100&page={page}"
                      )

                      data = api(endpoint)

                      if not isinstance(data, list):
                          valid = False
                          break

                      for item in data:
                          if isinstance(item, dict):
                              repo = valid_repo(
                                  item.get("full_name")
                              )
                              if repo:
                                  result.append(repo)

                      if len(data) < 100:
                          break

                      page += 1

                  if valid:
                      return result

              raise RuntimeError(
                  f"Unable to list repositories for owner {owner}"
              )

          with CONFIG.open(encoding="utf-8") as f:
              config = yaml.safe_load(f) or {}

          excludes = {
              x.lower()
              for x in config.get("exclude", [])
              if isinstance(x, str)
          }

          # Each batch:
          # 1. One owner from allrepositories.
          # 2. One explicit repositories.repoN group.
          batches = []

          for owner in config.get("allrepositories", []):
              if not isinstance(owner, str):
                  continue

              owner = owner.strip()

              if not re.fullmatch(
                  r"[A-Za-z0-9_.-]+",
                  owner,
              ):
                  print(f"Invalid owner skipped: {owner}")
                  continue

              batches.append((
                  f"owner:{owner}",
                  owner_repositories(owner),
              ))

          groups = config.get("repositories", {})

          for key, values in groups.items():
              if not re.fullmatch(r"repo\d+", str(key)):
                  continue

              if not isinstance(values, list):
                  continue

              repos = []

              for value in values:
                  repo = valid_repo(value)
                  if repo:
                      repos.append(repo)

              batches.append((
                  f"repositories.{key}",
                  repos,
              ))

          # Exclude and deduplicate repositories across batches.
          seen = set()
          clean_batches = []

          for label, repos in batches:
              clean = []

              for repo in repos:
                  if repo.lower() in excludes:
                      print(f"Excluded: {repo}")
                      continue

                  if repo.lower() in seen:
                      print(f"Duplicate skipped: {repo}")
                      continue

                  seen.add(repo.lower())
                  clean.append(repo)

              if clean:
                  clean_batches.append((label, clean))

          print(f"Total batches: {len(clean_batches)}")
          print(f"Total repositories: {len(seen)}")

          # Read existing commit-tracking.yaml.
          # Legacy format:
          # repo: BRANCHES:[name:sha;...]|RELEASE:[tag|sha]
          records = {}

          if TRACKING.exists():
              for line in TRACKING.read_text(
                  encoding="utf-8"
              ).splitlines():

                  if line.startswith("commit-tracking:"):
                      continue

                  match = re.match(
                      r"^([^:]+): BRANCHES:\[(.*)\]"
                      r"\|RELEASE:\[(.*)\]\s*$",
                      line,
                  )

                  if not match:
                      continue

                  repo, branch_text, release_text = match.groups()
                  branches = {}

                  for item in branch_text.split(";"):
                      if ":" in item:
                          name, sha = item.rsplit(":", 1)
                          if name and sha:
                              branches[name] = sha

                  parts = release_text.split("|", 1)

                  records[repo] = {
                      "branches": branches,
                      "release": parts[0],
                      "release_sha": (
                          parts[1] if len(parts) > 1 else "none"
                      ),
                  }

          def get_branches(repo):
              # Retrieve all branches before ranking.
              result = []
              page = 1

              while True:
                  data = api(
                      f"repos/{repo}/branches"
                      f"?per_page=100&page={page}"
                  )

                  if not isinstance(data, list):
                      raise RuntimeError(
                          f"Cannot list branches for {repo}"
                      )

                  result.extend(data)

                  if len(data) < 100:
                      break

                  page += 1

              ranked = []

              for branch in result:
                  name = branch.get("name")
                  sha = branch.get("commit", {}).get("sha")

                  if not name or not sha:
                      continue

                  commit = api(
                      f"repos/{repo}/commits/"
                      f"{quote(sha, safe='')}"
                  )

                  if not isinstance(commit, dict):
                      raise RuntimeError(
                          f"Cannot determine activity for "
                          f"{repo}/{name}"
                      )

                  info = commit.get("commit", {})
                  committer = info.get("committer") or {}
                  author = info.get("author") or {}

                  date = (
                      committer.get("date")
                      or author.get("date")
                      or ""
                  )

                  ranked.append({
                      "name": name,
                      "sha": sha,
                      "date": date,
                  })

              # Most recent commit first.
              ranked.sort(
                  key=lambda item: (
                      item["date"],
                      item["name"],
                  ),
                  reverse=True,
              )

              return ranked[:10]

          def latest_release(repo):
              data = api(
                  f"repos/{repo}/releases/latest"
              )

              if not isinstance(data, dict):
                  return {
                      "tag": "none",
                      "sha": "none",
                      "data": None,
                  }

              tag = data.get("tag_name") or "none"
              sha = "none"

              if tag != "none":
                  ref = api(
                      f"repos/{repo}/git/ref/tags/"
                      f"{quote(tag, safe='')}"
                  )

                  if isinstance(ref, dict):
                      obj = ref.get("object", {})
                      sha = obj.get("sha", "none")
                      kind = obj.get("type")

                      # Dereference annotated tags.
                      while kind == "tag" and sha != "none":
                          tag_obj = api(
                              f"repos/{repo}/git/tags/{sha}"
                          )

                          if not isinstance(tag_obj, dict):
                              sha = "none"
                              break

                          obj = tag_obj.get("object", {})
                          sha = obj.get("sha", "none")
                          kind = obj.get("type")

              return {
                  "tag": tag,
                  "sha": sha,
                  "data": data,
              }

          def download(url, output):
              # Download exactly one file.
              # No other repository's temporary files are retained.
              run([
                  "curl",
                  "-fLsS",
                  "--retry", "3",
                  "--retry-delay", "2",
                  "-H", f"Authorization: Bearer {TOKEN}",
                  "-H", "Accept: application/vnd.github+json",
                  url,
                  "-o", str(output),
              ])

              size = output.stat().st_size

              if size == 0:
                  output.unlink(missing_ok=True)
                  raise RuntimeError(
                      f"Downloaded file is empty: {output.name}"
                  )

              if size > MAX_ASSET_SIZE:
                  output.unlink(missing_ok=True)
                  raise RuntimeError(
                      f"File exceeds safe upload limit: "
                      f"{output.name} ({size} bytes)"
                  )

          def upload_one(tag, file):
              # Upload immediately, then delete the local file.
              try:
                  run([
                      "gh",
                      "release",
                      "upload",
                      tag,
                      str(file),
                      "--repo", TARGET,
                  ])
              except Exception:
                  raise
              else:
                  file.unlink(missing_ok=True)
                  print(f"Uploaded and removed: {file.name}")

          def persist_tracking():
              lines = [
                  "commit-tracking: "
                  + datetime.now(timezone.utc).strftime(
                      "%Y-%m-%d %H:%M"
                  )
              ]

              for repo in sorted(records):
                  item = records[repo]

                  branches = ";".join(
                      f"{name}:{sha}"
                      for name, sha in item["branches"].items()
                  )

                  lines.append(
                      f"{repo}: BRANCHES:[{branches}]"
                      f"|RELEASE:[{item['release']}"
                      f"|{item['release_sha']}]"
                  )

              TRACKING.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

              run(["git", "add", "commit-tracking.yaml"])

              diff = run(
                  ["git", "diff", "--cached", "--quiet"],
                  check=False,
              )

              if diff.returncode == 0:
                  print("Tracking file unchanged.")
                  return

              run([
                  "git", "commit", "-m",
                  "Update commit-tracking.yaml [skip ci]",
              ])

              run([
                  "git", "push", "origin",
                  f"HEAD:refs/heads/{TARGET_BRANCH}",
              ])

              print("Tracking file synchronized.")

          failures = []

          # Every repository gets its own temporary directory.
          # finally always attempts cleanup, including on failure.
          for batch_index, (label, repos) in enumerate(
              clean_batches, 1
          ):

              print("\n" + "=" * 70)
              print(
                  f"BATCH {batch_index}/{len(clean_batches)}: "
                  f"{label}"
              )
              print(f"Repositories: {len(repos)}")
              print("=" * 70)

              batch_completed = 0
              batch_failed = []

              for repo_index, repo in enumerate(repos, 1):
                  print(
                      f"\n[{repo_index}/{len(repos)}] {repo}"
                  )

                  work = None
                  created_tag = None
                  backup_succeeded = False

                  try:
                      work = Path(tempfile.mkdtemp(
                          prefix="repo-backup-"
                      ))

                      disk_status(f"before {repo}")

                      ranked = get_branches(repo)

                      current_branches = {
                          b["name"]: b["sha"]
                          for b in ranked
                      }

                      release = latest_release(repo)

                      previous = records.get(repo, {
                          "branches": {},
                          "release": "none",
                          "release_sha": "none",
                      })

                      old_branches = previous["branches"]

                      changed = [
                          b for b in ranked
                          if old_branches.get(b["name"])
                          != b["sha"]
                      ]

                      release_changed = (
                          release["tag"] != previous["release"]
                          or release["sha"]
                          != previous["release_sha"]
                      )

                      if not changed and not release_changed:
                          print("No changes; backup skipped.")

                          records[repo] = {
                              "branches": current_branches,
                              "release": release["tag"],
                              "release_sha": release["sha"],
                          }

                          backup_succeeded = True
                          continue

                      stamp = datetime.now(
                          timezone.utc
                      ).strftime("%Y%m%d-%H%M%S")

                      slug = safe_name(
                          repo.replace("/", "-")
                      )

                      created_tag = f"backup-{slug}-{stamp}"

                      # Create a draft first. It will not be published
                      # until every required asset has been uploaded.
                      notes = (
                          f"Source: https://github.com/{repo}\n"
                          f"Changed branches: {len(changed)}\n"
                          f"Latest release changed: "
                          f"{release_changed}\n"
                          f"Generated at: {stamp} UTC\n"
                      )

                      has_files = bool(changed) or (
                          release_changed and release["data"] is not None
                      )

                      if has_files:
                          run([
                              "gh",
                              "release",
                              "create",
                              created_tag,
                              "--repo", TARGET,
                              "--title", f"Backup {repo} {stamp}",
                              "--notes", notes,
                              "--draft",
                          ])

                      checksum_lines = []
                      uploaded_count = 0

                      def backup_and_upload(url, filename):
                          nonlocal_dummy = None

                          output = work / safe_name(filename)

                          try:
                              download(url, output)

                              digest = hashlib.sha256()
                              with output.open("rb") as stream:
                                  for chunk in iter(
                                      lambda: stream.read(1024 * 1024),
                                      b"",
                                  ):
                                      digest.update(chunk)

                              checksum_lines.append(
                                  f"{digest.hexdigest()}  {output.name}"
                              )

                              upload_one(created_tag, output)

                          finally:
                              # Also remove partial downloads if curl
                              # or upload fails.
                              output.unlink(missing_ok=True)

                      # Branch snapshots are processed one at a time.
                      for branch in changed:
                          name = branch["name"]
                          sha = branch["sha"]

                          filename = (
                              f"branch-{safe_name(name)}-"
                              f"{sha[:12]}.tar.gz"
                          )

                          backup_and_upload(
                              f"https://api.github.com/repos/{repo}"
                              f"/tarball/{sha}",
                              filename,
                          )

                          uploaded_count += 1
                          disk_status(f"after branch {repo}/{name}")

                      # Download, upload and delete each release asset
                      # separately; never retain the complete release.
                      if release_changed and release["data"]:
                          tag_name = release["tag"]

                          if tag_name != "none":
                              backup_and_upload(
                                  f"https://api.github.com/repos/{repo}"
                                  f"/tarball/{quote(tag_name, safe='')}",
                                  f"release-{safe_name(tag_name)}.tar.gz",
                              )

                              uploaded_count += 1

                          for asset in release["data"].get(
                              "assets", []
                          ):
                              url = asset.get("browser_download_url")
                              name = asset.get("name")

                              if not url or not name:
                                  continue

                              backup_and_upload(
                                  url,
                                  f"asset-{name}",
                              )

                              uploaded_count += 1
                              disk_status(
                                  f"after release asset {repo}/{name}"
                              )

                      # Upload a manifest after the other files.
                      if has_files and checksum_lines:
                          manifest = work / "SHA256SUMS.txt"

                          manifest.write_text(
                              "\n".join(checksum_lines) + "\n",
                              encoding="utf-8",
                          )

                          upload_one(created_tag, manifest)

                      # Publish only after all required uploads succeed.
                      if has_files:
                          run([
                              "gh",
                              "release",
                              "edit",
                              created_tag,
                              "--repo", TARGET,
                              "--draft=false",
                          ])

                      # Only now mark this repository as backed up.
                      records[repo] = {
                          "branches": current_branches,
                          "release": release["tag"],
                          "release_sha": release["sha"],
                      }

                      backup_succeeded = True
                      print(f"Repository completed: {repo}")

                  except Exception as exc:
                      print(
                          f"FAILED: {repo}: {exc}",
                          file=sys.stderr,
                      )

                      failures.append(repo)
                      batch_failed.append(repo)

                      # Delete incomplete draft releases so a partial
                      # upload is not mistaken for a complete backup.
                      if created_tag:
                          run([
                              "gh",
                              "release",
                              "delete",
                              created_tag,
                              "--repo", TARGET,
                              "--cleanup-tag",
                              "--yes",
                          ], check=False)

                  finally:
                      # Clean this repository immediately, whether
                      # successful, skipped, or failed.
                      if work is not None:
                          shutil.rmtree(
                              work,
                              ignore_errors=True,
                          )

                          print(
                              f"Temporary directory cleaned: {repo}"
                          )

                      disk_status(f"after cleanup {repo}")

                  if backup_succeeded:
                      batch_completed += 1

              # Synchronize once per owner or repoN batch, not per repo.
              if batch_completed:
                  print(
                      f"\nSynchronizing tracking after batch: {label}"
                  )

                  try:
                      persist_tracking()
                  except Exception as exc:
                      print(
                          f"TRACKING PUSH FAILED: {exc}",
                          file=sys.stderr,
                      )
                      sys.exit(1)

              else:
                  print(
                      f"No successful repositories in {label}; "
                      "tracking not synchronized."
                  )

              if batch_failed:
                  print(
                      f"Batch had failures: "
                      f"{', '.join(batch_failed)}"
                  )

          if failures:
              print(
                  "\nFailed repositories: "
                  + ", ".join(failures),
                  file=sys.stderr,
              )
              sys.exit(1)

          print("\nAll batches completed successfully.")
          PY