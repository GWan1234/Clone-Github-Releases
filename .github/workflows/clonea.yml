name: Clone Backup Repositories A

on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

# 避免同一工作流并发修改同一份跟踪文件。
concurrency:
  group: clone-backup-repositories-a
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_TOKEN }}

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq gh git curl p7zip-full coreutils bc

      - name: Run backup
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_TERMINAL_PROMPT=0
          shopt -s nullglob globstar

          # =========================
          # 时间配置与增量基线
          # =========================
          NOW_DATE=$(date +"%Y%m%d")
          NOW_TIME=$(date +"%H%M")
          NOW_HUMAN=$(date +"%Y-%m-%d %H:%M")
          TRACKING_FILE="commit-tracking-a-${NOW_DATE}.yaml"

          # 优先使用已经存在的当天文件；否则使用最近的历史文件。
          if [[ -f "$TRACKING_FILE" ]]; then
            LAST_TRACKING_FILE="$TRACKING_FILE"
          else
            LAST_TRACKING_FILE=$(
              find . -maxdepth 1 -type f \
                -name 'commit-tracking-a-*.yaml' \
                ! -name "$TRACKING_FILE" \
                -printf '%f\n' |
              sort -r |
              head -n 1 || true
            )
            LAST_TRACKING_FILE="${LAST_TRACKING_FILE:-}"

            if [[ -n "$LAST_TRACKING_FILE" && -f "$LAST_TRACKING_FILE" ]]; then
              echo "📋 Initializing today's tracking file from: $LAST_TRACKING_FILE"
              cp "$LAST_TRACKING_FILE" "$TRACKING_FILE"
            else
              echo "📋 No historical tracking file found; first run will back up repositories"
              printf '{}\n' > "$TRACKING_FILE"
            fi
          fi

          # 固定本次运行的比较基线。
          # 当天文件是工作目标，也是当天后续运行的增量基线。
          echo "📌 Tracking file: $TRACKING_FILE"
          echo "📌 Baseline file: $LAST_TRACKING_FILE"

          # =========================
          # 安全函数
          # =========================
          safe() {
            local v="${1:-unknown}"
            if [[ -z "$v" || "$v" == "null" || "$v" == "-" || "$v" == "none" ]]; then
              echo "unknown"
            else
              echo "$v"
            fi
          }

          sanitize() {
            printf '%s' "${1:-unknown}" |
              tr '/' '-' |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9._-]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//;s/-$//'
          }

          cleanup() {
            rm -rf -- tmp 2>/dev/null || true
            rm -f -- ./*.7z ./*.7z.* ./*.sha256 ./up-* ./core.* 2>/dev/null || true
          }

          auth_url() {
            printf 'https://x-access-token:%s@github.com/%s.git' "$GITHUB_TOKEN" "$1"
          }

          fetch_repo_info() {
            local result
            result=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$1") || {
                echo "⚠️ Failed to fetch repository metadata: $1" >&2
                return 1
              }
            printf '%s\n' "$result"
          }

          fetch_latest_release() {
            local repo="$1"
            local result
            # 没有发布过 Release 时，404 是正常情况。
            result=$(curl -sSL --retry 2 --retry-delay 1 --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -w '\n%{http_code}' \
              "https://api.github.com/repos/${repo}/releases/latest") || {
                echo "⚠️ Failed to query latest release: $repo" >&2
                return 1
              }

            local status body
            status="${result##*$'\n'}"
            body="${result%$'\n'*}"

            if [[ "$status" == "404" ]]; then
              printf '{}\n'
            elif [[ "$status" == "200" ]] && jq -e 'type == "object"' <<< "$body" >/dev/null; then
              printf '%s\n' "$body"
            else
              echo "⚠️ Unexpected release API response for $repo (HTTP $status)" >&2
              return 1
            fi
          }

          release_exists() {
            gh release view "$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          }

          human_size() {
            numfmt --to=iec --suffix=B "${1:-0}" 2>/dev/null || echo "0B"
          }

          safe_upload() {
            local file="$1"
            local tag="$2"

            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "❌ Missing or empty upload file: $file"
              return 1
            fi

            echo "Uploading: $file"
            if ! gh release upload "$tag" "$file" \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "❌ UPLOAD FAILED: $file"
              return 1
            fi
            return 0
          }

          set_tracking() {
            local repo="$1"
            local state="$2"
            local tmp_file

            [[ -n "$repo" && -n "$state" ]] || {
              echo "❌ Invalid tracking arguments"
              return 1
            }

            tmp_file=$(mktemp "${TRACKING_FILE}.XXXXXX")
            if ! yq -y --arg repo "$repo" --arg state "$state" \
              '.[$repo] = $state' "$TRACKING_FILE" > "$tmp_file"; then
              echo "❌ Failed to update tracking data: $repo"
              rm -f "$tmp_file"
              return 1
            fi

            if ! yq -e 'type == "object"' "$tmp_file" >/dev/null; then
              echo "❌ Invalid tracking YAML after updating $repo"
              rm -f "$tmp_file"
              return 1
            fi

            if ! mv "$tmp_file" "$TRACKING_FILE"; then
              echo "❌ Failed to save tracking file"
              rm -f "$tmp_file"
              return 1
            fi
          }

          sync_tracking() {
            echo -e "\n💾 Syncing tracking file to GitHub..."
            git config user.name "Action"
            git config user.email "action@github.com"

            local branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
            if [[ "$GITHUB_REF" == refs/pull/* ]]; then
              echo "❌ Refusing to push tracking file from a pull request"
              return 1
            fi

            # 获取远端最新状态并将本地跟踪文件变更放在其之上。
            if ! git fetch origin "$branch"; then
              echo "❌ Tracking fetch failed for branch: $branch"
              return 1
            fi

            if ! git checkout -B "$branch" "origin/$branch"; then
              echo "❌ Tracking checkout failed for branch: $branch"
              return 1
            fi

            git add -- "$TRACKING_FILE"

            if ! git diff --cached --quiet; then
              if ! git commit -m "track sync: $NOW_HUMAN"; then
                echo "❌ Tracking commit failed"
                return 1
              fi
            else
              echo "ℹ️ No tracking changes to commit"
            fi

            if ! git push origin "HEAD:$branch"; then
              echo "❌ Tracking push failed"
              return 1
            fi

            echo "✅ Tracking file synced"
          }

          # =========================
          # 获取仓库状态：
          # 所有本地分支的名称与 HEAD SHA + 最新上游 Release tag/commit
          # 实际打包仍然只打包按提交时间排序的 TOP10 分支。
          # =========================
          get_repo_current_state() {
            local repo="$1"
            local mirror="$2"
            local release_json="$3"

            local branch_states
            branch_states=$(
              git -C "$mirror" for-each-ref \
                --sort=refname \
                --format='%(refname:short):%(objectname)' \
                refs/heads
            )

            local rel_tag rel_commit
            rel_tag=$(jq -r '.tag_name // "none"' <<< "$release_json" 2>/dev/null || echo "none")
            rel_commit="none"

            if [[ "$rel_tag" != "none" ]]; then
              rel_commit=$(
                git -C "$mirror" rev-parse --verify \
                  "refs/tags/${rel_tag}^{}" 2>/dev/null ||
                git -C "$mirror" rev-parse --verify \
                  "refs/tags/${rel_tag}" 2>/dev/null ||
                true
              )
              rel_commit="${rel_commit:-none}"
            fi

            # 使用固定排序和明确分隔符，避免分支遍历顺序改变引起误判。
            printf 'BRANCHES:[%s]|RELEASE:[%s|%s]' \
              "$branch_states" "$rel_tag" "$rel_commit"
          }

          need_backup() {
            local repo="$1"
            local current_state="$2"

            if [[ -z "$LAST_TRACKING_FILE" || ! -f "$LAST_TRACKING_FILE" ]]; then
              return 0
            fi

            local last_state
            last_state=$(yq -r --arg repo "$repo" '.[$repo] // ""' \
              "$LAST_TRACKING_FILE" 2>/dev/null) || {
                echo "⚠️ Could not read tracking state for $repo; forcing backup"
                return 0
              }

            [[ "$last_state" != "$current_state" ]]
          }

          build_notes() {
            local REPO="$1"
            local REPO_JSON="$2"
            local BRANCH_COUNT="$3"
            local ARCHIVE_SIZE="$4"
            local RELEASE_TIME="$5"
            local UPSTREAM_JSON="$6"

            local REPO_URL DESC DEF_BRANCH LANG STARS FORKS
            local CREATED UPDATED PUSHED UP_TAG UP_NAME UP_TIME

            REPO_URL=$(safe "$(jq -r '.html_url // "unknown"' <<< "$REPO_JSON")")
            DESC=$(safe "$(jq -r '.description // "none"' <<< "$REPO_JSON")")
            DEF_BRANCH=$(safe "$(jq -r '.default_branch // "unknown"' <<< "$REPO_JSON")")
            LANG=$(safe "$(jq -r '.language // "unknown"' <<< "$REPO_JSON")")
            STARS=$(safe "$(jq -r '.stargazers_count // 0' <<< "$REPO_JSON")")
            FORKS=$(safe "$(jq -r '.forks_count // 0' <<< "$REPO_JSON")")
            CREATED=$(safe "$(jq -r '.created_at // "unknown"' <<< "$REPO_JSON")")
            UPDATED=$(safe "$(jq -r '.updated_at // "unknown"' <<< "$REPO_JSON")")
            PUSHED=$(safe "$(jq -r '.pushed_at // "unknown"' <<< "$REPO_JSON")")
            UP_TAG=$(safe "$(jq -r '.tag_name // "none"' <<< "$UPSTREAM_JSON")")
            UP_NAME=$(safe "$(jq -r '.name // "none"' <<< "$UPSTREAM_JSON")")
            UP_TIME=$(safe "$(jq -r '.published_at // "none"' <<< "$UPSTREAM_JSON")")

            printf -- "## 📦 Repository Info\n"
            printf -- "- URL: %s\n" "$REPO_URL"
            printf -- "- Description: %s\n" "$DESC"
            printf -- "- Default branch: %s\n" "$DEF_BRANCH"
            printf -- "- Language: %s\n" "$LANG"
            printf -- "- Stars: %s | Forks: %s\n\n" "$STARS" "$FORKS"

            printf -- "## 🕒 Source Timeline\n"
            printf -- "- Created: %s\n" "$CREATED"
            printf -- "- Updated: %s\n" "$UPDATED"
            printf -- "- Pushed: %s\n\n" "$PUSHED"

            printf -- "## 🏷 Upstream Release\n"
            printf -- "- Tag: %s\n" "$UP_TAG"
            printf -- "- Name: %s\n" "$UP_NAME"
            printf -- "- Published: %s\n\n" "$UP_TIME"

            printf -- "## 📊 Backup Info\n"
            printf -- "- Branch count: %s\n" "$BRANCH_COUNT"
            printf -- "- Archive size: %s\n" "$(human_size "$ARCHIVE_SIZE")"
            printf -- "- Backup time: %s\n\n" "$RELEASE_TIME"
            printf -- "## 🔍 Incremental Backup\n"
            printf -- "- Track all branch HEAD commits and latest release tag/commit\n"
            printf -- "- Package up to 10 branches sorted by commit time\n"
            printf -- "- Backup triggered by tracked state changes\n"
          }

          # =========================
          # 获取用户/组织全部 public repo
          # =========================
          get_all_repos() {
            local owner="$1"
            local user_info type api_endpoint page data count

            if ! user_info=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$owner"); then
              echo "❌ Error: Could not resolve owner $owner" >&2
              return 1
            fi

            type=$(jq -r '.type // empty' <<< "$user_info")
            if [[ -z "$type" ]]; then
              echo "❌ Error: Could not resolve owner type for $owner" >&2
              return 1
            fi

            if [[ "$type" == "Organization" ]]; then
              api_endpoint="orgs/$owner/repos"
            else
              api_endpoint="users/$owner/repos"
            fi

            page=1
            while :; do
              if ! data=$(curl -fsSL --retry 2 --retry-delay 1 --max-time 30 \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/${api_endpoint}?type=public&per_page=100&page=$page"); then
                echo "❌ API request failed for $owner (page $page)" >&2
                return 1
              fi

              if ! jq -e 'type == "array"' <<< "$data" >/dev/null; then
                echo "❌ Invalid API response for $owner (page $page)" >&2
                return 1
              fi

              count=$(jq 'length' <<< "$data")
              [[ "$count" -eq 0 ]] && break

              jq -r '.[] | select(.private == false) | .full_name // empty' <<< "$data"
              [[ "$count" -lt 100 ]] && break
              page=$((page + 1))
            done
          }

          backup_repo() {
            local REPO="$1"
            echo -e "\n====================================="
            echo "==== BACKUP: $REPO ===="
            echo "====================================="

            cleanup
            mkdir -p tmp

            local error_occurred=0
            local REPO_SLUG TAG
            REPO_SLUG=$(sanitize "$REPO")
            TAG="${REPO_SLUG}-${NOW_DATE}-${NOW_TIME}"
            TAG=$(sanitize "$TAG")

            local REPO_JSON UPSTREAM_JSON
            if ! REPO_JSON=$(fetch_repo_info "$REPO"); then
              cleanup
              return 1
            fi
            if ! UPSTREAM_JSON=$(fetch_latest_release "$REPO"); then
              cleanup
              return 1
            fi

            local MIRROR EXPORT
            MIRROR="tmp/${REPO_SLUG}.git"
            EXPORT="tmp/export/${REPO_SLUG}"
            mkdir -p "$EXPORT"

            echo "🔽 Cloning repository mirror..."
            if ! git clone --mirror "$(auth_url "$REPO")" "$MIRROR"; then
              echo "❌ Clone failed: $REPO"
              cleanup
              return 1
            fi

            local CURRENT_STATE
            CURRENT_STATE=$(get_repo_current_state "$REPO" "$MIRROR" "$UPSTREAM_JSON")

            if ! need_backup "$REPO" "$CURRENT_STATE"; then
              echo "✅ Skip: $REPO (no changes)"
              cleanup
              return 0
            fi
            echo "🔴 Changes detected or no valid baseline → backup"

            # 仅在确认需要备份后处理同名 Release。
            if release_exists "$TAG"; then
              echo "⚠️ Release $TAG already exists; replacing it because this backup is required"
              if ! gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y; then
                echo "❌ Failed to remove existing Release: $TAG"
                cleanup
                return 1
              fi
            fi

            mapfile -t BRANCHES < <(
              git -C "$MIRROR" for-each-ref \
                --sort=-committerdate \
                --format='%(refname:short)' refs/heads
            )
            BRANCHES=("${BRANCHES[@]:0:10}")

            if [[ ${#BRANCHES[@]} -eq 0 ]]; then
              echo "❌ No branches found, skip: $REPO"
              cleanup
              return 1
            fi

            echo "📦 Packaging ${#BRANCHES[@]} branches (TOP10 latest)..."
            local -a FILES=()
            local IDX=0 B B_SLUG DIR ARCHIVE f

            for B in "${BRANCHES[@]}"; do
              B_SLUG=$(sanitize "$B")
              DIR="${EXPORT}/${B_SLUG}"
              mkdir -p "$DIR"

              if ! git -C "$MIRROR" archive "$B" | tar -xf - -C "$DIR"; then
                echo "❌ Failed to export branch: $B"
                error_occurred=1
                continue
              fi

              ARCHIVE="${REPO_SLUG}-${B_SLUG}-${IDX}.7z"
              if ! 7z a -t7z -mx5 -mmt2 -v1500m "$ARCHIVE" "$DIR"; then
                echo "❌ Compression failed: $ARCHIVE"
                error_occurred=1
                IDX=$((IDX + 1))
                continue
              fi

              local -a generated_parts=()
              for f in "${ARCHIVE}"*; do
                [[ -f "$f" && -s "$f" && "$f" != *.sha256 ]] || continue
                generated_parts+=("$f")
              done

              if [[ ${#generated_parts[@]} -eq 0 ]]; then
                echo "❌ No archive volumes generated: $ARCHIVE"
                error_occurred=1
              else
                for f in "${generated_parts[@]}"; do
                  if ! sha256sum "$f" > "${f}.sha256"; then
                    echo "❌ SHA256 generation failed: $f"
                    error_occurred=1
                  else
                    FILES+=("$f" "${f}.sha256")
                  fi
                done
              fi

              IDX=$((IDX + 1))
            done

            if [[ ${#FILES[@]} -eq 0 || $error_occurred -ne 0 ]]; then
              echo "❌ Archive generation incomplete; refusing to publish"
              cleanup
              return 1
            fi

            local TOTAL_SIZE=0
            for f in "${FILES[@]}"; do
              [[ "$f" == *.sha256 ]] && continue
              TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$f")))
            done

            local NOTES_FILE
            NOTES_FILE=$(mktemp)
            build_notes "$REPO" "$REPO_JSON" "${#BRANCHES[@]}" \
              "$TOTAL_SIZE" "$NOW_HUMAN" "$UPSTREAM_JSON" > "$NOTES_FILE"

            echo "🚀 Creating release: $TAG"
            if ! gh release create "$TAG" "${FILES[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$REPO_SLUG ($NOW_HUMAN)" \
              --notes-file "$NOTES_FILE"; then
              echo "❌ Release create failed: $TAG"
              rm -f "$NOTES_FILE"
              cleanup
              return 1
            fi

            # 上传剩余归档分卷和校验文件；任何必要文件失败都不更新 tracking。
            echo "📤 Uploading remaining ${#FILES[@]} files..."
            local i
            for ((i=1; i<${#FILES[@]}; i++)); do
              if ! safe_upload "${FILES[$i]}" "$TAG"; then
                error_occurred=1
              fi
            done

            # 同步上游 Release 资产。
            # 上游资产同步失败会标记失败，避免把不完整的备份记为成功。
            echo "🔗 Syncing upstream assets..."
            local ASSETS_DATA ASSET_NAME ASSET_URL
            ASSETS_DATA=$(jq -c '.assets[]? | select(.name != null and .browser_download_url != null)' \
              <<< "$UPSTREAM_JSON" 2>/dev/null || true)

            if [[ -n "$ASSETS_DATA" ]]; then
              while IFS= read -r asset; do
                [[ -z "$asset" ]] && continue
                ASSET_NAME=$(jq -r '.name' <<< "$asset")
                ASSET_URL=$(jq -r '.browser_download_url' <<< "$asset")

                # 防止上游资产文件名包含路径分隔符或覆盖临时目录以外文件。
                local ASSET_SAFE
                ASSET_SAFE=$(basename -- "$ASSET_NAME")
                echo "--> Asset: $ASSET_NAME"

                if ! curl -fL --retry 2 --retry-delay 1 --max-time 60 \
                  -o "up-${ASSET_SAFE}" "$ASSET_URL"; then
                  echo "❌ Upstream asset download failed: $ASSET_NAME"
                  error_occurred=1
                  rm -f -- "up-${ASSET_SAFE}"
                  continue
                fi

                if [[ -s "up-${ASSET_SAFE}" ]]; then
                  if ! safe_upload "up-${ASSET_SAFE}" "$TAG"; then
                    error_occurred=1
                  fi
                else
                  echo "❌ Empty upstream asset: $ASSET_NAME"
                  error_occurred=1
                fi
                rm -f -- "up-${ASSET_SAFE}"
              done <<< "$ASSETS_DATA"
            fi

            rm -f "$NOTES_FILE"

            if [[ $error_occurred -eq 0 ]]; then
              echo "✅ Backup upload complete → updating tracking"
              if ! set_tracking "$REPO" "$CURRENT_STATE"; then
                echo "❌ Tracking update failed: $REPO"
                error_occurred=1
              fi
            else
              echo "❌ Backup incomplete → tracking state NOT updated"
            fi

            cleanup
            if [[ $error_occurred -eq 0 ]]; then
              echo "✅ Backup success: $REPO"
              return 0
            else
              echo "⚠️ Backup finished with warnings: $REPO"
              return 1
            fi
          }

          process_all() {
            local -a excluded_repos=()
            local -a OWNERS=()
            local -a ALL_KEYS=()
            local -a REPOS=()
            local O R KEY
            local failures=0

            # 加载排除列表。
            mapfile -t excluded_repos < <(
              yq -r '.exclude[]?' repositoriesa.yaml 2>/dev/null |
                grep -v '^[[:space:]]*#' |
                sed '/^[[:space:]]*$/d' || true
            )

            is_excluded() {
              local repo="$1"
              local ex
              for ex in "${excluded_repos[@]}"; do
                [[ "$repo" == "$ex" ]] && return 0
              done
              return 1
            }

            # 1) 扫描用户/组织公开仓库。
            mapfile -t OWNERS < <(
              yq -r '.allrepositories[]?' repositoriesa.yaml 2>/dev/null |
                grep -v '^[[:space:]]*#' |
                sed '/^[[:space:]]*$/d' || true
            )

            for O in "${OWNERS[@]}"; do
              [[ -z "$O" ]] && continue
              echo -e "\n====================================="
              echo "==== Scanning owner: $O ===="
              echo "====================================="

              local repo_output
              if ! repo_output=$(get_all_repos "$O"); then
                echo "❌ Failed to scan owner: $O"
                failures=$((failures + 1))
                continue
              fi

              mapfile -t REPOS < <(printf '%s\n' "$repo_output" | sed '/^[[:space:]]*$/d')
              if [[ ${#REPOS[@]} -eq 0 ]]; then
                echo "ℹ️ No public repos found"
                continue
              fi

              for R in "${REPOS[@]}"; do
                if is_excluded "$R"; then
                  echo "⛔ Excluded: $R"
                  continue
                fi
                if ! backup_repo "$R"; then
                  failures=$((failures + 1))
                fi
              done
            done

            # 2) 手动指定仓库组。
            echo -e "\n====================================="
            echo "==== Processing manual repositories ===="
            echo "====================================="

            mapfile -t ALL_KEYS < <(
              yq -r '.repositories | keys[]' repositoriesa.yaml 2>/dev/null |
                grep -v '^[[:space:]]*#' |
                sed '/^[[:space:]]*$/d' || true
            )

            for KEY in "${ALL_KEYS[@]}"; do
              echo "➡️ Group: $KEY"
              mapfile -t REPOS < <(
                yq -r --arg key "$KEY" '.repositories[$key] // [] | .[]' \
                  repositoriesa.yaml 2>/dev/null |
                  grep -v '^[[:space:]]*#' |
                  sed '/^[[:space:]]*$/d' || true
              )

              for R in "${REPOS[@]}"; do
                [[ -z "$R" ]] && continue
                if is_excluded "$R"; then
                  echo "⛔ Excluded: $R"
                  continue
                fi
                if ! backup_repo "$R"; then
                  failures=$((failures + 1))
                fi
              done
            done

            # 所有仓库处理完毕后，统一提交并推送 tracking。
            echo -e "\n====================================="
            echo "==== Final tracking synchronization ===="
            echo "====================================="

            if ! sync_tracking; then
              echo "❌ Tracking synchronization failed"
              return 1
            fi

            if [[ $failures -gt 0 ]]; then
              echo "❌ Completed with $failures repository/scan failures"
              return 1
            fi

            echo "✅ All repositories processed successfully"
          }

          process_all
          echo -e "\n🎉 All done"
