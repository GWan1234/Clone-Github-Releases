
name: Clone Backup Repositories A

on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-backup-repositories-a
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml p7zip-full
          gh --version
          python3 --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Backup repositories by batch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import sys
          import json
          import yaml
          import hashlib
          import subprocess
          import tempfile
          import re
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import quote

          TOKEN = os.environ["GH_TOKEN"]
          TARGET = os.environ["GH_REPO"]
          TARGET_BRANCH = os.environ["GH_BRANCH"]
          CONFIG = Path("repositoriesa.yaml")
          TRACKING = Path("commit-tracking.yaml")

          def run(args, check=True):
              p = subprocess.run(
                  args, text=True, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE
              )
              if check and p.returncode:
                  raise RuntimeError(
                      f"Command failed: {' '.join(args)}\n{p.stderr}"
                  )
              return p

          def api(endpoint):
              p = run(["gh", "api", endpoint], check=False)
              if p.returncode:
                  return None
              try:
                  return json.loads(p.stdout)
              except (ValueError, TypeError):
                  return None

          def valid_repo(value):
              if not isinstance(value, str):
                  return None
              value = value.strip().rstrip("/")
              value = re.sub(r"^https?://github\.com/", "", value)
              value = re.sub(r"\.git$", "", value)
              if re.fullmatch(
                  r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", value
              ):
                  return value
              return None

          def excluded(repo, excludes):
              return repo.lower() in excludes

          def owner_repositories(owner):
              # Try organization repositories first, then user repositories.
              for prefix in ("orgs", "users"):
                  result = []
                  valid = True
                  page = 1

                  while True:
                      data = api(
                          f"{prefix}/{quote(owner, safe='')}/repos"
                          f"?type=all&per_page=100&page={page}"
                      )
                      if not isinstance(data, list):
                          valid = False
                          break

                      for item in data:
                          if isinstance(item, dict):
                              name = valid_repo(item.get("full_name"))
                              if name:
                                  result.append(name)

                      if len(data) < 100:
                          break
                      page += 1

                  if valid:
                      return result

              raise RuntimeError(
                  f"Cannot list repositories for owner: {owner}"
              )

          with CONFIG.open(encoding="utf-8") as f:
              config = yaml.safe_load(f) or {}

          excludes = {
              x.lower()
              for x in config.get("exclude", [])
              if isinstance(x, str)
          }

          # Each batch is either one owner from allrepositories,
          # or one explicit repositories.repoN list.
          batches = []
          for owner in config.get("allrepositories", []):
              if not isinstance(owner, str):
                  continue
              owner = owner.strip()
              if not re.fullmatch(r"[A-Za-z0-9_.-]+", owner):
                  print(f"Invalid owner: {owner}")
                  continue

              batches.append((
                  f"owner:{owner}",
                  owner_repositories(owner)
              ))

          groups = config.get("repositories", {})
          for key, values in groups.items():
              if not re.fullmatch(r"repo\d+", str(key)):
                  continue
              if not isinstance(values, list):
                  continue

              repos = []
              for value in values:
                  repo = valid_repo(value)
                  if repo:
                      repos.append(repo)

              batches.append((f"repositories.{key}", repos))

          # Exclude repositories and deduplicate across all batches.
          seen = set()
          clean_batches = []

          for label, repos in batches:
              clean = []
              for repo in repos:
                  if excluded(repo, excludes):
                      print(f"Excluded: {repo}")
                      continue
                  if repo.lower() in seen:
                      print(f"Duplicate skipped: {repo}")
                      continue
                  seen.add(repo.lower())
                  clean.append(repo)

              if clean:
                  clean_batches.append((label, clean))

          print(f"Total batches: {len(clean_batches)}")
          print(f"Total repositories: {len(seen)}")

          # Read the existing legacy tracking format.
          records = {}
          if TRACKING.exists():
              for line in TRACKING.read_text(
                  encoding="utf-8"
              ).splitlines():
                  if line.startswith("commit-tracking:"):
                      continue

                  match = re.match(
                      r"^([^:]+): BRANCHES:\[(.*)\]"
                      r"\|RELEASE:\[(.*)\]\s*$",
                      line
                  )
                  if not match:
                      continue

                  repo, branch_text, release_text = match.groups()
                  branches = {}

                  for item in branch_text.split(";"):
                      if ":" in item:
                          name, sha = item.rsplit(":", 1)
                          if name and sha:
                              branches[name] = sha

                  release_parts = release_text.split("|", 1)
                  records[repo] = {
                      "branches": branches,
                      "release": release_parts[0],
                      "release_sha": (
                          release_parts[1]
                          if len(release_parts) > 1 else "none"
                      ),
                  }

          def get_branches(repo):
              # Fetch ALL branch pages before sorting by latest commit time.
              result = []
              page = 1

              while True:
                  data = api(
                      f"repos/{repo}/branches"
                      f"?per_page=100&page={page}"
                  )
                  if not isinstance(data, list):
                      raise RuntimeError(
                          f"Failed to list branches: {repo}"
                      )

                  result.extend(data)
                  if len(data) < 100:
                      break
                  page += 1

              ranked = []

              for branch in result:
                  name = branch.get("name")
                  sha = branch.get("commit", {}).get("sha")

                  if not name or not sha:
                      continue

                  commit = api(
                      f"repos/{repo}/commits/{quote(sha, safe='')}"
                  )
                  if not isinstance(commit, dict):
                      raise RuntimeError(
                          f"Cannot determine activity: {repo}/{name}"
                      )

                  info = commit.get("commit", {})
                  committer = info.get("committer") or {}
                  author = info.get("author") or {}

                  date = (
                      committer.get("date")
                      or author.get("date")
                      or ""
                  )

                  ranked.append({
                      "name": name,
                      "sha": sha,
                      "date": date,
                  })

              # Latest commit first. Branch name breaks timestamp ties.
              ranked.sort(
                  key=lambda b: (b["date"], b["name"]),
                  reverse=True
              )

              return ranked[:10]

          def latest_release(repo):
              data = api(f"repos/{repo}/releases/latest")

              if not isinstance(data, dict):
                  return {
                      "tag": "none",
                      "sha": "none",
                      "data": None,
                  }

              tag = data.get("tag_name") or "none"
              sha = "none"

              if tag != "none":
                  ref = api(
                      f"repos/{repo}/git/ref/tags/"
                      f"{quote(tag, safe='')}"
                  )

                  if isinstance(ref, dict):
                      obj = ref.get("object", {})
                      sha = obj.get("sha", "none")
                      kind = obj.get("type")

                      # Dereference annotated tags.
                      while kind == "tag" and sha != "none":
                          tag_obj = api(
                              f"repos/{repo}/git/tags/{sha}"
                          )
                          if not isinstance(tag_obj, dict):
                              sha = "none"
                              break
                          obj = tag_obj.get("object", {})
                          sha = obj.get("sha", "none")
                          kind = obj.get("type")

              return {"tag": tag, "sha": sha, "data": data}

          def download(url, output):
              p = run([
                  "curl", "-fLsS", "--retry", "3",
                  "--retry-delay", "2",
                  "-H", f"Authorization: Bearer {TOKEN}",
                  "-H", "Accept: application/vnd.github+json",
                  url, "-o", str(output)
              ])
              return p

          def safe_name(value):
              value = re.sub(r"[^A-Za-z0-9_.-]", "_", value)
              return value[:150] or "unnamed"

          def persist_tracking():
              lines = [
                  "commit-tracking: " +
                  datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M")
              ]

              for repo in sorted(records):
                  item = records[repo]
                  branches = ";".join(
                      f"{name}:{sha}"
                      for name, sha in item["branches"].items()
                  )
                  lines.append(
                      f"{repo}: BRANCHES:[{branches}]"
                      f"|RELEASE:[{item['release']}"
                      f"|{item['release_sha']}]"
                  )

              TRACKING.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

              run(["git", "add", "commit-tracking.yaml"])

              diff = run(
                  ["git", "diff", "--cached", "--quiet"],
                  check=False
              )

              if diff.returncode == 0:
                  print("Tracking file unchanged; no commit needed.")
                  return

              run([
                  "git", "commit", "-m",
                  "Update commit-tracking.yaml [skip ci]"
              ])

              run([
                  "git", "push", "origin",
                  f"HEAD:refs/heads/{TARGET_BRANCH}"
              ])

              print("Tracking file synchronized.")

          failures = []

          with tempfile.TemporaryDirectory(
              prefix="repo-backup-"
          ) as temp_dir:

              root = Path(temp_dir)

              for batch_index, (label, repos) in enumerate(
                  clean_batches, 1
              ):
                  print("\n" + "=" * 70)
                  print(
                      f"BATCH {batch_index}/{len(clean_batches)}: "
                      f"{label}"
                  )
                  print(f"Repositories: {len(repos)}")
                  print("=" * 70)

                  # Pending records are accumulated throughout this batch.
                  # No tracking push occurs inside the repository loop.
                  batch_completed = 0
                  batch_failed = []

                  for repo_index, repo in enumerate(repos, 1):
                      print(
                          f"\n[{repo_index}/{len(repos)}] {repo}"
                      )

                      try:
                          ranked = get_branches(repo)
                          current_branches = {
                              b["name"]: b["sha"] for b in ranked
                          }
                          release = latest_release(repo)

                          previous = records.get(repo, {
                              "branches": {},
                              "release": "none",
                              "release_sha": "none",
                          })

                          old_branches = previous["branches"]

                          changed = [
                              b for b in ranked
                              if old_branches.get(b["name"])
                              != b["sha"]
                          ]

                          release_changed = (
                              release["tag"] != previous["release"]
                              or release["sha"]
                              != previous["release_sha"]
                          )

                          if not changed and not release_changed:
                              print("No changes; backup skipped.")
                              records[repo] = {
                                  "branches": current_branches,
                                  "release": release["tag"],
                                  "release_sha": release["sha"],
                              }
                              batch_completed += 1
                              continue

                          work = root / (
                              f"batch{batch_index}_"
                              f"{safe_name(repo.replace('/', '__'))}"
                          )
                          work.mkdir(parents=True, exist_ok=True)
                          assets = []

                          # Back up changed branches as source snapshots.
                          for branch in changed:
                              archive = work / (
                                  f"branch-{safe_name(branch['name'])}-"
                                  f"{branch['sha'][:12]}.tar.gz"
                              )

                              download(
                                  f"https://api.github.com/repos/{repo}"
                                  f"/tarball/{branch['sha']}",
                                  archive
                              )
                              assets.append(archive)

                          # Back up the latest release when it changes.
                          if release_changed and release["data"]:
                              tag = release["tag"]

                              if tag != "none":
                                  archive = work / (
                                      f"release-{safe_name(tag)}.tar.gz"
                                  )
                                  download(
                                      f"https://api.github.com/repos/{repo}"
                                      f"/tarball/{quote(tag, safe='')}",
                                      archive
                                  )
                                  assets.append(archive)

                              for asset in release["data"].get(
                                  "assets", []
                              ):
                                  url = asset.get("browser_download_url")
                                  name = asset.get("name")

                                  if not url or not name:
                                      continue

                                  output = work / (
                                      "asset-" + safe_name(name)
                                  )
                                  download(url, output)
                                  assets.append(output)

                          # Release removal is also a state change.
                          # It has no downloadable files, but should update
                          # tracking after this repository is processed.
                          if assets:
                              checksum = work / "SHA256SUMS.txt"

                              with checksum.open(
                                  "w", encoding="utf-8"
                              ) as f:
                                  for file in assets:
                                      digest = hashlib.sha256(
                                          file.read_bytes()
                                      ).hexdigest()
                                      f.write(
                                          f"{digest}  {file.name}\n"
                                      )

                              assets.append(checksum)

                              upload_assets = []

                              for file in assets:
                                  if file.stat().st_size > (
                                      1500 * 1024 * 1024
                                  ):
                                      prefix = work / (
                                          file.name + ".7z"
                                      )
                                      run([
                                          "7z", "a", "-t7z",
                                          "-v1500m",
                                          str(prefix), str(file)
                                      ])

                                      upload_assets.extend(sorted(
                                          work.glob(prefix.name + ".*")
                                      ))
                                  else:
                                      upload_assets.append(file)

                              stamp = datetime.now(
                                  timezone.utc
                              ).strftime("%Y%m%d-%H%M%S")

                              tag_name = (
                                  f"backup-{safe_name(repo.replace('/', '-'))}"
                                  f"-{stamp}"
                              )

                              notes = (
                                  f"Source: https://github.com/{repo}\n"
                                  f"Changed branches: {len(changed)}\n"
                                  f"Latest release changed: "
                                  f"{release_changed}\n"
                                  f"Generated at: {stamp} UTC\n"
                              )

                              run([
                                  "gh", "release", "create", tag_name,
                                  *[str(x) for x in upload_assets],
                                  "--repo", TARGET,
                                  "--title", f"Backup {repo} {stamp}",
                                  "--notes", notes
                              ])

                          # Only update tracking after this repository has
                          # successfully completed all required operations.
                          records[repo] = {
                              "branches": current_branches,
                              "release": release["tag"],
                              "release_sha": release["sha"],
                          }

                          batch_completed += 1
                          print(f"Repository completed: {repo}")

                      except Exception as exc:
                          print(
                              f"FAILED: {repo}: {exc}",
                              file=sys.stderr
                          )
                          failures.append(repo)
                          batch_failed.append(repo)

                  # One tracking synchronization per completed batch.
                  # Successful repositories are saved even if another
                  # repository in the same batch failed.
                  if batch_completed:
                      print(
                          f"\nSynchronizing tracking after batch: {label}"
                      )
                      try:
                          persist_tracking()
                      except Exception as exc:
                          print(
                              f"TRACKING PUSH FAILED: {exc}",
                              file=sys.stderr
                          )
                          sys.exit(1)
                  else:
                      print(
                          f"No successful repositories in {label}; "
                          "tracking not synchronized."
                      )

                  if batch_failed:
                      print(
                          f"Batch completed with failures: "
                          f"{', '.join(batch_failed)}"
                      )

          if failures:
              print(
                  "\nFailed repositories: " + ", ".join(failures),
                  file=sys.stderr
              )
              sys.exit(1)

          print("\nAll batches completed successfully.")
          PY